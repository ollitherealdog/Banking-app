<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gingo Bank</title>
<style>
:root{--a:#E3B93C;--bg:#0E2B27;--bg2:#143832;--tx:#F3F1E7;--mu:#93ADA6;--ln:#24504A;--ok:#6FD39A;--no:#F08A7A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
#view{flex:1;overflow-y:auto;padding:20px 18px 24px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.5px}h2{font-size:17px;margin:22px 0 10px}p{margin:0 0 10px;color:var(--mu)}
.btn{background:var(--a);color:#1b1704;border:0;border-radius:14px;padding:14px 18px;font-weight:700;width:100%;cursor:pointer}
.btn.s{background:var(--bg2);color:var(--tx);border:1px solid var(--ln)}.btn.d{background:transparent;color:var(--no);border:1px solid var(--no)}.btn:disabled{opacity:.35}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
input,select{width:100%;background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}
.card{background:var(--bg2);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bal{font-size:44px;font-weight:700;letter-spacing:-1.5px;margin:2px 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.tile{background:var(--bg2);border:1px solid var(--ln);border-radius:16px;padding:14px 4px;text-align:center;font-size:13px;cursor:pointer}
.tile svg{display:block;margin:0 auto 6px}
.tx{padding:12px 0;border-bottom:1px solid var(--ln)}.tx:last-child{border:0}
.pos{color:var(--ok)}.neg{color:var(--tx)}
nav{display:flex;border-top:1px solid var(--ln);background:var(--bg2);padding:6px 4px 8px}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--a)}nav svg{display:block;margin:0 auto 2px}
.ov{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;justify-content:center;padding:26px;overflow-y:auto}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg2);width:100%;border-radius:24px 24px 0 0;padding:22px;border-top:1px solid var(--ln)}
.toast{position:absolute;top:10px;left:14px;right:14px;z-index:50;background:var(--a);color:#1b1704;border-radius:14px;padding:12px 16px;font-weight:600;transform:translateY(-140%);transition:transform .35s}
.toast.on{transform:none}
.flip{perspective:900px;height:210px;margin-bottom:14px}.flip>div{position:relative;height:100%;transition:transform .7s;transform-style:preserve-3d;cursor:pointer}
.flip.f>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,var(--a),#8a6d12);color:#1b1704}
.face.b{transform:rotateY(180deg);padding:20px 0}
.strip{background:#1b1704;height:40px}.sig{background:#f3f1e7;margin:0 20px;padding:8px 12px;border-radius:6px;text-align:right;font-weight:700;letter-spacing:2px}
.lock .face{filter:grayscale(1) brightness(.6)}
.check{width:120px;height:120px;margin:0 auto 18px;display:block}
.check circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:340;stroke-dashoffset:340;animation:d .6s ease forwards}
.check path{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:d .4s .5s ease forwards}
@keyframes d{to{stroke-dashoffset:0}}
.leaf{animation:sp 1.6s ease-out both}@keyframes sp{from{transform:rotate(-40deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
.logo{animation:fi 1s .7s both;font-size:34px;font-weight:700;letter-spacing:-1px}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.float{position:absolute;left:50%;top:150px;z-index:40;font-size:28px;font-weight:700;animation:fl 1.4s ease-out forwards;pointer-events:none}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.sw{display:flex;gap:10px;margin-bottom:12px}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--ln);color:var(--tx)}
.help details{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}.help summary{font-weight:600;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
/* ===== Redesign: Aurora Glas ===== */
:root{--bg:#F3F0FA;--bg2:rgba(255,255,255,.66);--tx:#1B1630;--mu:#6B6585;--ln:rgba(110,90,180,.16);--ok:#17935B;--no:#D9534A}
html,body{background:#E9E4F6}
#app{background:var(--bg)}
#app::before{content:"";position:absolute;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 15%,rgba(150,110,255,.45),transparent 40%),radial-gradient(circle at 85% 30%,var(--a),transparent 38%),radial-gradient(circle at 40% 85%,rgba(90,200,230,.45),transparent 42%);filter:blur(30px);opacity:.75;animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(6%,-5%) rotate(14deg) scale(1.15)}}
#view{position:relative;z-index:1;padding:26px 18px 110px}
nav[hidden]{display:none}
nav{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;border:1px solid rgba(255,255,255,.8);border-radius:30px;background:rgba(255,255,255,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 40px rgba(60,40,130,.22);padding:6px;gap:2px}
nav button{border-radius:24px;padding:8px 0;color:var(--mu);transition:all .35s cubic-bezier(.3,1.5,.5,1)}
nav button.on{background:var(--a);color:#1B1630;transform:translateY(-6px) scale(1.06);box-shadow:0 10px 22px -6px var(--a)}
nav button:active{transform:scale(.9)}
.card,.tile,input,select{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card{border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:0 12px 34px rgba(80,55,160,.10);padding:18px}
.tile{border:1px solid rgba(255,255,255,.85);border-radius:22px;box-shadow:0 8px 22px rgba(80,55,160,.09);transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s;padding:16px 4px}
.tile:hover{transform:translateY(-5px) scale(1.04)}.tile:active{transform:scale(.92)}
.tile svg{color:var(--tx);stroke-width:1.6;transition:transform .4s}.tile:hover svg{transform:rotate(-8deg) scale(1.15)}
input,select{border-radius:16px;border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 2px 6px rgba(80,55,160,.08);transition:box-shadow .3s,transform .3s}
input:focus,select:focus{outline:0;box-shadow:0 0 0 3px var(--a);transform:translateY(-1px)}
.btn{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#fff));box-shadow:0 12px 26px -8px var(--a);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .3s;color:#1B1630}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn.s{background:rgba(255,255,255,.75);box-shadow:0 6px 16px rgba(80,55,160,.10);color:var(--tx);border:1px solid #fff}.btn.d{background:rgba(255,255,255,.5);box-shadow:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}@keyframes rip{to{transform:scale(3.4);opacity:0}}
.bal{font-size:54px;font-weight:800;letter-spacing:-2.5px;background:linear-gradient(100deg,var(--tx) 30%,#7A4FD6 55%,var(--tx) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
#view>*{animation:up .7s cubic-bezier(.2,.9,.25,1) both}
#view>*:nth-child(2){animation-delay:.06s}#view>*:nth-child(3){animation-delay:.12s}#view>*:nth-child(4){animation-delay:.18s}#view>*:nth-child(5){animation-delay:.24s}#view>*:nth-child(6){animation-delay:.3s}#view>*:nth-child(7){animation-delay:.36s}#view>*:nth-child(n+8){animation-delay:.42s}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.tx{animation:up .6s both}.tx:nth-child(2){animation-delay:.1s}.tx:nth-child(3){animation-delay:.18s}.tx:nth-child(4){animation-delay:.26s}.tx:nth-child(n+5){animation-delay:.34s}
.tx{border-color:var(--ln)}
.face{background:radial-gradient(circle at 88% 8%,var(--a),transparent 46%),linear-gradient(135deg,#1B1630,#3B2A8C 70%,#5B3FC4);color:#fff;box-shadow:0 24px 50px -14px rgba(59,42,140,.7);overflow:hidden}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:gl 4s ease-in-out infinite}
@keyframes gl{55%,100%{transform:translateX(120%)}}
.flip>div{transition:transform .9s cubic-bezier(.3,1.3,.4,1)}
.flip:not(.f):not(.lock){animation:fl2 5s ease-in-out infinite}@keyframes fl2{50%{transform:translateY(-6px) rotate(-.6deg)}}
.ov{background:rgba(243,240,250,.88);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.sheet{background:rgba(27,22,48,.45);backdrop-filter:blur(6px)}
.sheet>div{background:#fff;border:0;border-radius:32px 32px 0 0;animation:sl .5s cubic-bezier(.2,.9,.25,1) both;box-shadow:0 -20px 50px rgba(40,20,100,.25)}
@keyframes sl{from{transform:translateY(100%)}}
.toast{background:#1B1630;color:#fff;border-radius:22px;box-shadow:0 16px 40px rgba(30,15,80,.4);transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.leaf{filter:drop-shadow(0 0 22px var(--a));animation:sp 1.6s cubic-bezier(.2,1.3,.4,1) both,gw 2.6s 1.6s ease-in-out infinite alternate}
@keyframes gw{to{filter:drop-shadow(0 0 40px var(--a));transform:scale(1.07)}}
.logo{background:linear-gradient(100deg,var(--tx) 30%,var(--a) 50%,var(--tx) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fi 1s .7s both,sh 3s 1.5s linear infinite}
.check circle{stroke:var(--ok)}
.float{color:var(--ok);text-shadow:0 4px 18px rgba(23,147,91,.4)}
#view .card svg{animation:pu 2.2s ease-in-out infinite;filter:drop-shadow(0 0 14px var(--a))}@keyframes pu{50%{transform:scale(1.12)}}
.sw i{transition:transform .3s cubic-bezier(.3,1.7,.5,1);box-shadow:0 6px 14px rgba(0,0,0,.18)}.sw i:hover{transform:scale(1.2)}
.badge{background:var(--a);color:#1B1630;font-weight:600}
.help details{border-radius:20px;border:1px solid #fff;backdrop-filter:blur(18px);transition:box-shadow .3s}.help details[open]{box-shadow:0 12px 30px rgba(80,55,160,.14)}
.pt{position:absolute;left:50%;top:42%;width:10px;height:10px;border-radius:50%;z-index:45;pointer-events:none;animation:pt 1.2s ease-out forwards}
@keyframes pt{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2);opacity:0}}
/* ===== v3: PIN, Login, Benachrichtigung, Desktop ===== */
.sheet>div{position:relative}
.dots{display:flex;gap:18px;justify-content:center;margin:22px 0 26px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--tx);transition:background .15s,border-color .15s}
.dot.on{background:var(--tx);animation:pop .3s cubic-bezier(.3,1.8,.5,1)}@keyframes pop{50%{transform:scale(1.6)}}
.dots.bad .dot{border-color:var(--no);background:var(--no)}
.shake{animation:shk .5s}@keyframes shk{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.kp{display:grid;grid-template-columns:repeat(3,auto);gap:14px;justify-content:center}
.k{width:min(19vw,11vh,78px);height:min(19vw,11vh,78px);border-radius:50%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);backdrop-filter:blur(14px);box-shadow:0 8px 20px rgba(80,55,160,.12);font-size:28px;font-weight:500;cursor:pointer;display:grid;place-items:center;color:var(--tx);transition:transform .2s cubic-bezier(.3,1.7,.5,1),background .2s;animation:kin .5s both;padding:0}
.kp>:nth-child(-n+3){animation-delay:.15s}.kp>:nth-child(n+4):nth-child(-n+6){animation-delay:.22s}.kp>:nth-child(n+7):nth-child(-n+9){animation-delay:.29s}.kp>:nth-child(n+10){animation-delay:.36s}
@keyframes kin{from{opacity:0;transform:scale(.4)}}
.k:active{transform:scale(.86);background:var(--a)}.k.g{background:transparent;box-shadow:none;border-color:transparent;backdrop-filter:none}
.lk{align-items:center;text-align:center}.lk>*{animation:up .7s both}
.lg{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#1B1630;background:linear-gradient(135deg,var(--a),#fff);box-shadow:0 0 0 6px rgba(255,255,255,.6),0 14px 34px -6px var(--a);animation:up .7s both,br 3s 1s ease-in-out infinite}
@keyframes br{50%{box-shadow:0 0 0 14px rgba(255,255,255,.25),0 14px 44px -6px var(--a)}}
#view .ov.unl{pointer-events:none;animation:unl .7s cubic-bezier(.5,0,.8,.4) forwards}@keyframes unl{to{opacity:0;transform:scale(1.25);filter:blur(14px)}}
.scanl{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border-radius:inherit;animation:rf .3s both;color:var(--tx)}
.scanl .ln{stroke:var(--a);stroke-width:3;animation:scn 1.2s ease-in-out infinite}@keyframes scn{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
.scanl .fc{stroke-dasharray:80;stroke-dashoffset:80;animation:d 1s .1s forwards}
.scanl.okd .ln{display:none}.scanl.okd svg{animation:pu .4s}@keyframes rf{from{opacity:0}}
.res{background:rgba(255,255,255,.3)!important;backdrop-filter:blur(22px) saturate(1.5);animation:rf .35s both;transition:opacity .5s}.res.gone{opacity:0}
.rs{width:120px;height:120px;margin:0 auto 18px;display:block;animation:zin .6s cubic-bezier(.3,1.6,.5,1) both}@keyframes zin{from{transform:scale(.4);opacity:0}}
.rs circle{fill:rgba(255,255,255,.4);stroke:rgba(27,22,48,.7);stroke-width:3;stroke-dasharray:340;stroke-dashoffset:340;animation:d .7s ease forwards}
.rs path{fill:none;stroke:rgba(27,22,48,.85);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:d .45s .55s ease forwards}
.res.bad .rs circle,.res.bad .rs path{stroke:rgba(217,83,74,.9)}
.check circle{stroke:rgba(27,22,48,.7);fill:rgba(255,255,255,.4);stroke-width:3}.check path{stroke:rgba(27,22,48,.85);stroke-width:5}
.notif{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:420px;margin:0 auto;z-index:70;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:26px;background:rgba(255,255,255,.78);backdrop-filter:blur(26px) saturate(1.6);border:1px solid #fff;box-shadow:0 22px 50px rgba(40,20,100,.28);overflow:hidden;animation:nd .7s cubic-bezier(.2,1.4,.4,1) both;cursor:pointer}
.notif.out{transition:transform .5s,opacity .5s;transform:translateY(-160%);opacity:0}@keyframes nd{from{transform:translateY(-170%) scale(.9)}}
.ni{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#fff);position:relative}
.ni::after{content:"";position:absolute;inset:0;border-radius:14px;border:2px solid var(--a);animation:ping 1.6s ease-out infinite}@keyframes ping{to{transform:scale(1.7);opacity:0}}
.nt{flex:1;min-width:0}.nt .row{font-size:12px;color:var(--mu)}.nh{font-weight:700}.nb b{font-size:19px;color:var(--ok);letter-spacing:-.5px}
.np{position:absolute;left:0;bottom:0;height:3px;background:var(--a);animation:npb 4.2s linear forwards}@keyframes npb{from{width:100%}to{width:0}}
@media(min-width:600px){#app{max-width:620px}}
@media(min-width:900px){
html,body{overflow:hidden}
#app{max-width:1180px;height:calc(100% - 48px);margin:24px auto;border-radius:36px;border:1px solid #fff;box-shadow:0 40px 100px rgba(60,40,130,.28)}
nav{left:18px;top:18px;bottom:18px;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:6px;padding:14px}
nav button{display:flex;align-items:center;gap:12px;font-size:15px;padding:14px 16px;text-align:left;border-radius:18px}nav button svg{margin:0}nav button.on{transform:translateX(6px)}
#view{padding:36px 40px 40px 270px}#view>*{max-width:760px;margin-left:auto;margin-right:auto}

}
/* ===== v4: Layout, Karte, Freunde, Geldeingang ===== */
html,body{background:radial-gradient(circle at 15% 10%,rgba(150,110,255,.5),transparent 40%),radial-gradient(circle at 90% 80%,rgba(90,200,230,.5),transparent 40%),#E9E4F6}
@media(max-width:699px){#app{max-width:none;height:100dvh;border-radius:0}.tile{font-size:12px;padding:14px 2px}.tiles{gap:8px}.bal{font-size:clamp(38px,12vw,54px)}}
@media(min-width:700px){#app{max-width:820px;height:calc(100dvh - 40px);margin:20px auto;border-radius:36px;border:1px solid #fff;box-shadow:0 40px 100px rgba(60,40,130,.28)}}
@media(min-width:700px) and (max-width:899px){nav{left:50%;right:auto;width:min(520px,calc(100% - 28px));transform:translateX(-50%)}#view>*{max-width:640px;margin-left:auto;margin-right:auto}}
@media(min-width:900px){nav{left:50%;right:auto;top:auto;bottom:18px;width:min(520px,calc(100% - 28px));transform:translateX(-50%);flex-direction:row;padding:6px;gap:2px}nav button{display:block;font-size:12px;padding:8px 0;text-align:center}nav button svg{margin:0 auto 2px}nav button.on{transform:translateY(-6px) scale(1.06)}#view{padding:30px 18px 120px}#view>*{max-width:680px}.tiles{gap:12px}.bal{font-size:60px}}
.chip{width:42px;height:30px;border-radius:7px;background:linear-gradient(135deg,#f4e3a0,#b8923a)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#1B1630;flex:none}
.np{animation-duration:5s}
.coin{position:absolute;top:-40px;z-index:55;border-radius:50%;width:var(--s);height:var(--s);background:radial-gradient(circle at 30% 30%,#fff3b0,#E3B93C 55%,#a97f10);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.2);animation:cn 2s linear both;pointer-events:none}@keyframes cn{to{transform:translateY(110vh) rotate(var(--r))}}
#app.glow::after{content:"";position:absolute;inset:0;z-index:54;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 70px 6px var(--a);animation:gl2 1.4s ease-out forwards}@keyframes gl2{from{opacity:1}to{opacity:0}}
.wave{position:absolute;left:50%;top:90px;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid var(--a);z-index:54;pointer-events:none;animation:wv 1.2s ease-out forwards}@keyframes wv{to{transform:scale(40);opacity:0}}
.bump{animation:bm .7s cubic-bezier(.3,1.8,.5,1)!important}@keyframes bm{40%{transform:scale(1.12)}}
/* ===== v5: Tempo ===== */
*{-webkit-tap-highlight-color:transparent}button,.tile,.k{touch-action:manipulation}
#view{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#app::before{animation:none;filter:none;opacity:.5;inset:0}
.card,.tile,input,select,nav,.k,.notif,.ov,.sheet,.scanl,.res,.help details,.sheet>div{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

@keyframes up{from{opacity:0;transform:translateY(10px)}}

:root{--bg:#0B1220;--sf:#131C2E;--in:#0F1829;--k:#1B2740;--bg2:#131C2E;--tx:#EAF0FA;--mu:#8EA0BD;--ln:#22304A;--ok:#4ADE80;--no:#F87171;color-scheme:dark}

</style></head><body><div id="app"><div class="toast" id="toast"></div><div id="view"></div><nav id="nav" hidden></nav></div>
<script>
const $=s=>document.querySelector(s),eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
let S,tab='home',sessionOk=false,shown=0;
const load=()=>{try{S=JSON.parse(localStorage.getItem('gingo'))}catch(e){S=null}};
const save=()=>{try{localStorage.setItem('gingo',JSON.stringify(S))}catch(e){}};
load();
const THEMES={Ginkgo:'#E3B93C',Minze:'#6FD39A',Himmel:'#7DB8F0',Koralle:'#F08A7A',Flieder:'#B9A2F0'};
const IC={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',card:'M2 6h20v12H2zM2 10h20',pay:'M5 12a7 7 0 0 1 14 0M8 12a4 4 0 0 1 8 0M12 12v.1',users:'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-4 3-6 6-6s6 2 6 6M17 8a3 3 0 0 1 0 6M21 20c0-3-1-5-3-6',set:'M4 6h16M4 12h16M4 18h16M9 4v4M15 10v4M8 16v4'};
const ico=(k,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
const LEAF='<svg class="leaf" width="110" height="110" viewBox="0 0 100 100"><path d="M50 90V50M50 50C20 50 8 28 14 12c14 2 30 6 36 38 6-32 22-36 36-38 6 16-6 38-36 38z" fill="none" stroke="#E3B93C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function snd(t){try{const c=new (window.AudioContext||window.webkitAudioContext)(),n=t==='pay'?[[880,0],[1318,.12],[1760,.24]]:t==='in'?[[660,0],[990,.1]]:[[440,0]];n.forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+.3);o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.35)})}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)}
function applyTheme(){document.documentElement.style.setProperty('--a',S&&S.theme||'#E3B93C')}
function move(amt,label,kind){S.bal=Math.round((S.bal+amt)*100)/100;S.txs.unshift({t:Date.now(),l:label,a:amt,k:kind||''});S.txs=S.txs.slice(0,60);save();
 const f=document.createElement('div');f.className='float '+(amt>0?'pos':'');f.textContent=(amt>0?'+':'-')+eur(Math.abs(amt));$('#app').appendChild(f);setTimeout(()=>f.remove(),1500);if(amt>0)snd('in');
 if(amt>0){notif(label,amt);cash(amt)}else if(kind==='sub')notif(label,amt);if(tab==='home')render()}
function countTo(el,from,to){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/450);el.textContent=eur(from+(to-from)*p);if(p<1)requestAnimationFrame(f)})(t0)}
const fmtD=t=>new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function iban(){let s='DE';for(let i=0;i<20;i++)s+=Math.floor(Math.random()*10);return s}
const fi=s=>s.replace(/(.{4})/g,'$1 ').trim();

/* ---------- Start flow ---------- */
function disclaimer(){
 $('#nav').hidden=true;
 $('#view').innerHTML=`<div class="ov"><h1>Wichtiger Hinweis</h1><p>Bitte lies diese Bedingungen, bevor du Gingo Bank nutzt.</p>
 <div class="card"><p style="color:var(--tx)">Gingo Bank ist keine echte Banking-App. Es gibt kein echtes Konto, kein echtes Geld und keine Verbindung zu einer Bank. Die App dient nur zum Spaß.</p>
 <p style="color:var(--tx)">Du darfst damit niemanden täuschen oder betrügen. Wenn jemand die App dafür missbraucht, übernimmt der Entwickler dafür keine Haftung.</p></div>
 <label class="row" style="justify-content:flex-start;gap:12px;color:var(--tx);margin-bottom:18px"><input type="checkbox" id="ck" style="width:22px;margin:0"> Ich habe die Bedingungen gelesen und akzeptiere sie.</label>
 <button class="btn" id="go" disabled>Bestätigen und weiter</button></div>`;
 $('#ck').onchange=e=>$('#go').disabled=!e.target.checked;
 $('#go').onclick=()=>{sessionOk=true;splash()}}
function splash(){
 $('#view').innerHTML=`<div class="ov" style="align-items:center;text-align:center">${LEAF}<div class="logo">Gingo Bank</div><p style="margin-top:6px;animation:fi 1s 1.2s both">Dein Konto. Deine Regeln.</p></div>`;
 setTimeout(()=>S&&S.setup?(S.pin?lock():main()):setup(),2800)}
function setup(){
 $('#view').innerHTML=`<div class="ov"><h1>Konto einrichten</h1><p>Wähle deine Daten. Alles bleibt auf diesem Gerät.</p>
 <label>Name</label><input id="n" placeholder="Vor- und Nachname">
 <label>Wunsch-IBAN (leer lassen für automatische IBAN)</label><input id="i" placeholder="DE00 0000 0000 0000 0000 00">
 <label>Startguthaben in Euro</label><input id="b" type="number" value="1000" min="0">
 <label>Zahlungs-PIN (4 Ziffern)</label><input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="4 Ziffern">
 <label>App-PIN (4 Ziffern, optional)</label><input id="ap" type="password" inputmode="numeric" maxlength="4" placeholder="leer lassen für keine">
 <p style="font-size:13px"><a href="#" id="nopw" style="color:var(--a)">Ich möchte kein App-Passwort</a></p>
 <button class="btn" id="ok">Konto erstellen</button></div>`;
 $('#nopw').onclick=e=>{e.preventDefault();$('#ap').value='';toast('Kein App-Passwort gesetzt')};
 $('#ok').onclick=()=>{const n=$('#n').value.trim(),pw=$('#pw').value;if(!n)return toast('Bitte gib einen Namen ein');if(!/^\d{4}$/.test(pw))return toast('Die Zahlungs-PIN besteht aus 4 Ziffern');if($('#ap').value&&!/^\d{4}$/.test($('#ap').value))return toast('Die App-PIN besteht aus 4 Ziffern');
  let ib=$('#i').value.replace(/\s/g,'').toUpperCase();if(ib&&!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(ib))return toast('Diese IBAN ist ungültig');
  S={setup:1,name:n,iban:ib||iban(),bal:0,txs:[],bills:[],subs:[],friends:[],reqs:[],theme:'#E3B93C',pin:$('#ap').value,payPw:pw,scam:false,
   card:{name:n.toUpperCase(),num:'5'+Array.from({length:15},()=>Math.floor(Math.random()*10)).join(''),exp:'11/30',cvc:String(100+Math.floor(Math.random()*900)),locked:false},
   nfc:{store:'',amt:0,mode:'once',left:0},gen:{on:false,amt:100,sec:10}};
  S.bal=Math.max(0,+$('#b').value||0);S.txs.push({t:Date.now(),l:'Startguthaben',a:S.bal,k:''});save();applyTheme();main()}}
function lock(){
 $('#view').innerHTML=`<div class="ov"><h1>Willkommen zurück</h1><p>Gib dein App-Passwort ein.</p><input id="p" type="password" placeholder="App-Passwort"><button class="btn" id="ok">Entsperren</button></div>`;
 $('#ok').onclick=()=>$('#p').value===S.pin?main():toast('Falsches Passwort')}

/* ---------- Main ---------- */
function main(){applyTheme();const n=$('#nav');n.hidden=false;
 n.innerHTML=[['home','Start'],['card','Karte'],['pay','Bezahlen'],['users','Freunde'],['set','Mehr']].map(([k,l])=>`<button data-t="${k}">${ico(k)}${l}</button>`).join('');
 n.onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render()}};render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const v=$('#view');v.scrollTop=0;
 ({home:rHome,card:rCard,pay:rPay,users:rFriends,set:rSet})[tab](v)}
function txList(a){return a.length?a.map(t=>`<div class="tx row"><div><div>${t.l}</div><div style="font-size:12px;color:var(--mu)">${fmtD(t.t)}</div></div><b class="${t.a>0?'pos':'neg'}">${t.a>0?'+':'-'}${eur(Math.abs(t.a))}</b></div>`).join(''):'<p>Noch keine Umsätze.</p>'}
function rHome(v){
 const open=S.bills.filter(b=>!b.paid),subsum=S.subs.reduce((s,x)=>s+x.rate,0);
 v.innerHTML=`<p style="margin:0">Hallo ${S.name.split(' ')[0]}</p><div style="font-size:13px;color:var(--mu)">Girokonto</div><div class="bal" id="bal">${eur(shown)}</div><div style="font-size:13px;color:var(--mu)">${fi(S.iban)}</div>
 <div class="tiles"><div class="tile" data-g="pay">${ico('pay')}Bezahlen</div><div class="tile" data-g="card">${ico('card')}Karte</div><div class="tile" data-g="users">${ico('users')}Freunde</div><div class="tile" data-g="set">${ico('set')}Mehr</div></div>
 <div class="card"><div class="row"><b>Abzüge</b><span class="badge">${S.subs.length} Abos</span></div><p style="margin:6px 0 0">Laufende Abos: ${S.subs.length?eur(subsum)+' pro Minute / Monat':'keine'}</p><p style="margin:0">Offene Rechnungen: ${open.length} (${eur(open.reduce((s,b)=>s+b.a,0))})</p></div>
 ${open.map(b=>`<div class="card row"><div><b>${b.l}</b><div style="font-size:13px;color:var(--mu)">${eur(b.a)}</div></div><button class="btn sm" data-bill="${b.id}">Bezahlen</button></div>`).join('')}
 <h2>Umsätze</h2><div class="card">${txList(S.txs.slice(0,12))}</div>`;
 v.querySelectorAll('[data-g]').forEach(e=>e.onclick=()=>{tab=e.dataset.g;render()});
 v.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>{const bl=S.bills.find(x=>x.id==b.dataset.bill);confirmPay(bl.l,bl.a,false,()=>{bl.paid=true;move(-bl.a,bl.l,'bill')})});
 const el=$('#bal');countTo(el,shown,S.bal);shown=S.bal}
function rCard(v){const c=S.card;
 v.innerHTML=`<h1>Karte</h1><p>Tippe auf die Karte, um sie zu drehen.</p>
 <div class="flip ${S.flip?'f':''} ${c.locked?'lock':''}" id="fl"><div>
 <div class="face"><div class="row"><b style="font-size:20px">Gingo</b><span>${c.locked?'Gesperrt':'Debit'}</span></div><div style="font-size:21px;letter-spacing:2px;font-weight:600">${fi(c.num)}</div><div class="row"><span>${c.name}</span><span>${c.exp}</span></div></div>
 <div class="face b"><div class="strip"></div><div class="sig" style="margin-top:20px">${c.cvc}</div><div style="padding:0 20px;font-size:12px;margin-top:14px">${c.name}<br>${fi(S.iban)}<br>Gültig bis ${c.exp}. Diese Karte ist nicht echt.</div></div></div></div>
 <button class="btn s" id="lk" style="margin-bottom:10px">${c.locked?'Karte entsperren':'Karte sperren'}</button>
